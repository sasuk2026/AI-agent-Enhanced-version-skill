# 增强版网站资源抓取 2.0 - 配置模板
# 复制为 config.yaml 并按需修改，运行时用 --config 传入

fetcher:
  # ---- 基础 ----
  timeout: 20            # 单次请求超时（秒）
  delay: 1.0             # 请求间隔（秒）—— 礼貌抓取，避免压垮目标站
  max_retries: 3         # 失败重试次数（指数退避：1s/2s/4s…）
  verify_ssl: true       # 是否校验 SSL 证书
  obey_robots: true      # 是否遵守 robots.txt（Disallow + Crawl-delay）
  allow_private: false   # 是否允许抓取内网/私有地址。默认 false（SSRF 防护，切勿随意开启）

  # ---- 2.0 反爬对抗 ----
  user_agent: ""         # 指定 UA 则关闭轮换；留空 = 真实 UA 池轮换
  rotate_ua: true        # UA 池轮换（真实 Chrome/Edge/Firefox/Safari UA）
  browser_fallback: auto # 被反爬拦截时的策略：auto=自动升级渲染 | always=直接用浏览器 | never=只静态
  proxy: ""              # 单代理，如 http://127.0.0.1:7890
  # proxies:             # 代理池（轮换），与 proxy 二选一
  #   - http://127.0.0.1:7890
  #   - socks5://127.0.0.1:7891
  # cookies:             # 预设 Cookie（登录态/风控态）
  #   sessionid: "abc123"
  # extra_headers:       # 自定义请求头
  #   Accept-Language: "zh-CN,zh;q=0.9"

# ---- 图片抓取默认值（命令行可覆盖）----
images:
  max_images: 0          # 0=全部；N=前 N 张（AI 调用时自行决定）
  min_width: 0
  min_height: 0
  workers: 4             # 并发下载数
  skip_icons: true       # 过滤 33px 以下图标/追踪像素
